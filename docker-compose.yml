services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ab_platform
      POSTGRES_PASSWORD: synthetic_only
      POSTGRES_DB: ab_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ab_platform -d ab_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://ab_platform:synthetic_only@postgres:5432/ab_platform?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    profiles:
      - frontend

volumes:
  postgres_data:
  frontend_node_modules:
